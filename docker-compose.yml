version: '3.8'

services:
  # --- БЭКЕНД НА DJANGO ---
  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./App:/app
    ports:
      - "8000:8000"
    networks:
      - demo-network
    depends_on:
      - postgres

  # --- БАЗА ДАННЫХ POSTGRESQL ---
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - demo-network

  # --- ВЕБ-СЕРВЕР NGINX ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - demo-network
    depends_on:
      - backend

volumes:
  postgres-data:

networks:
  demo-network:
    driver: bridge
  