<div class="tab-pane" id="feedback">
    <h2>Советы и предложения (Именные)</h2>
    <p>Помните: все отзывы публикуются с вашим именем для сохранения порядка и уважения.</p>
    <div class="card" style="margin-top: 15px;">
        <textarea id="feedback-input" placeholder="Напишите ваше предложение..." rows="3" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;"></textarea>
        <button class="btn-primary" id="send-feedback" style="margin-top: 10px;">Отправить отзыв</button>
    </div>
    <div id="feedback-list" style="margin-top: 20px;">
        <div class="card" style="margin-bottom: 10px;">
            <p><b>Ойбек Усманов:</b> Было бы круто добавить темную тему по умолчанию для всех!</p>
        </div>
    </div>
</div>
