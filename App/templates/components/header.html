<header class="top-header flex flex-col md:flex-row justify-between items-start md:items-center gap-4 px-8 py-6 border-b border-gray-200/50 bg-white/50 backdrop-blur-md sticky top-0 z-40">
    <div class="user-greeting">
        <h2 class="text-2xl font-bold text-gray-900">Привет, <span id="username-display">Абдурафи</span>! 👋</h2>
        <p class="text-gray-500 text-sm">Добро пожаловать обратно на платформу EduDash.</p>
    </div>
    <div class="flex items-center gap-3 flex-wrap">
        <div class="flex items-center space-x-2 bg-gray-100 px-4 py-2 rounded-xl border border-gray-200">
            <span class="text-lg">🪙</span>
            <span class="text-sm font-bold text-gray-800" id="header-coins">150 монеток</span>
        </div>
        <div class="flex items-center space-x-2 bg-gray-100 px-4 py-2 rounded-xl border border-gray-200">
            <span class="text-lg">🔥</span>
            <span class="text-sm font-bold text-amber-600">5 дней стрика</span>
        </div>

        <!-- Иконка настроек -->
        <button onclick="document.querySelector('[data-tab=settings]').click()" class="p-2.5 bg-gray-100 hover:bg-indigo-50 hover:text-indigo-600 text-gray-600 rounded-xl border border-gray-200 transition shadow-sm" title="Настройки системы">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>

        <!-- Кнопка Выхода -->
        <a href="{% url 'home' %}" class="flex items-center space-x-2 bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-xl border border-red-200 transition font-medium text-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            <span>Выйти</span>
        </a>
    </div>
</header>
